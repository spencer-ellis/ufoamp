[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ufoamp"
dynamic = ["version"]
description = "Tree-level helicity amplitudes and squared matrix elements directly from a UFO model"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Spencer Ellis"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
jax = ["jax>=0.4", "jaxlib>=0.4"]
test = ["jax>=0.4", "jaxlib>=0.4"]

[project.scripts]
ufoamp-validate = "ufoamp.validate:main"

[tool.setuptools]
packages = ["ufoamp"]

[tool.setuptools.dynamic]
version = {attr = "ufoamp.__version__"}

[tool.setuptools.package-data]
ufoamp = ["py.typed"]
